<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fixerBgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f5229"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Icon Metallic Gradient -->
    <linearGradient id="iconGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Checkmark Badge Gradient -->
    <linearGradient id="checkGrad" x1="80" y1="80" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#052e16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container Badge -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#fixerBgGrad)" filter="url(#dropShadow)"/>

  <!-- Inner Glowing Rim -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="31.5" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>

  <!-- Glass Gloss Highlight -->
  <path d="M 8 40 C 8 22.327 22.327 8 40 8 L 88 8 C 105.673 8 120 22.327 120 40 L 120 54 C 64 64 20 56 8 40 Z" fill="url(#glossGrad)"/>

  <!-- Center Fixer Gear & Wrench Symbol -->
  <g transform="translate(64,60)">
    <!-- House & Gear Shield Silhouette -->
    <path d="M0 -32 L28 -10 V26 C28 30.4 24.4 34 20 34 H-20 C-24.4 34 -28 30.4 -28 26 V-10 Z" fill="#ffffff" fill-opacity="0.14"/>
    
    <!-- Crossed Wrench & Screwdriver -->
    <!-- Wrench -->
    <g transform="rotate(-30)">
      <rect x="-5" y="-24" width="10" height="48" rx="5" fill="url(#iconGrad)"/>
      <circle cx="0" cy="-22" r="11" fill="url(#iconGrad)"/>
      <path d="M-4 -30 L4 -30 L5 -20 L-5 -20 Z" fill="url(#fixerBgGrad)"/>
    </g>

    <!-- Screwdriver -->
    <g transform="rotate(35)">
      <rect x="-4" y="-26" width="8" height="50" rx="4" fill="url(#iconGrad)"/>
      <path d="M-9 -24 L9 -24 L6 -16 L-6 -16 Z" fill="url(#iconGrad)"/>
    </g>
  </g>

  <!-- Verified Checkmark Badge at Bottom Right -->
  <g transform="translate(94, 94)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="15" fill="url(#checkGrad)"/>
    <!-- Checkmark icon -->
    <path d="M-6 0 L-2 4 L6 -4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>